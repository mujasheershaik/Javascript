<!-- HTML  -->

<!-- HTML is a standard markup language for creating web pages.  -->

<!-- With the help of HTML, we can create our own website.  -->

<!-- What is HTML?  -->

<!-- HTML stands for HYPER TEXT MARKUP LANGUAGE  -->

<!-- HTML is the standard markup language for creating web pages.  -->

<!-- HTML describes the structure of a web page  -->

<!-- HTML consists of a series of elements  -->

<!-- HTML elements tells the browser how to display the content -->

<!-- HTML elements label pieces of content such as "This is a Heading",
 "This is a Paragrapth", "This is a Link" -->


<!-- Example :  -->
<!DOCTYPE html>
<html>
<head>
<title> Page Title </title>
</head>
<body>

<h1>This is a Heading</h1>
<p> This is a Paragraph</p>

</body>
</html>

<!-- This Example explained:  -->

<!-- <!DOCTYPE html> This doctype html defines that this document 
 is HTML document   -->

<!-- <html> This HTML element is the root element of the HTML Page -->

<!-- <head> This Head contains meta information about the page -->

<!-- <title> This Title element specifies a title for the HTML page -->

<!-- <body> This Body element defines the document's body, and is a 
container for all the visible contents, such as Headings, Paragraphs,
 Images, Videos, Hyperlinks, Tables, Lists, etc -->

<!-- <h1> This h1 defines a large heading -->

<!-- <p>This p defines a Paragraph -->

<!-- What is an HTML Element? -->

<!-- An HTML Element is defined by a start tag, some content, end tag -->

<h1>This is First Heading</h1>

<p>This is First Paragraph</p>

<!-- Start Tag           Content                  End Tag -->
<h1>          This is First Heading           </h1>
<p>           This is First Paragraph         </p>

<!-- Web Browser  -->

<!-- The purpose of a Web Browser is to read the HTML document and to display them correctly -->

<!-- A browser doesn't display the HTML tags, but uses them to determine how to display the document -->
