<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="./Student Application Form.css">
    <style>
    @media(max-width:768px){

.form-container{

width:90%;

}

}
    </style>
</head>
<body>
    <h1 id="title">Student Application Form</h1>

<!-- Inline CSS -->
<p style="text-align:center;color:red;font-size:20px;">Fill all the details carefully.</p>

<div class="background">

    <div class="form-container">

        <h2>Application Form</h2>

        <form>
            <label>Student Name</label>
            <input type="text">

            <label>Father Name</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Phone Number:</label>
            <input type="tel">

            <label>Date of Birth:</label>
            <input type="date">

            <label>Gender</label>

            <select>
                <option>Male</option>
                <option>Female</option>
            </select>

            <label>Courses</label>

            <select>

                <option>Diploma</option>
                <option>Bachelor of Engineering</option>
                <option>Masters</option>
            </select>

            <label>Address:</label>

            <textarea rows="4"></textarea>

            <button type="submit">Submit Application</button>
        </form>

    </div>

</div>

</body>
</html>
