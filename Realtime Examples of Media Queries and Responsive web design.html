<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Responsive Layout</title>
    <link rel="stylesheet" href="./Realtime Examples of Media Queries and Responsive web design.css">
</head>
<body>
    
    <!-- Header (Flexbox)  -->
    <header class="header">
        <div class="logo">Mywebsite</div>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Main Layout (Flex) -->
    <div class="container">

        <!-- Side Bar  -->
        <aside class="aside">
            <h3>Menu</h3>
            <p>Mobiles</p>
            <p>Laptops</p>
            <p>Watches</p>
        </aside>

        <!-- Cards using Grid  -->
        
        <section class="cards">
            <div class="card">Card1</div>
            <div class="card">Card2</div>
            <div class="card">Card3</div>
            <div class="card">Card4</div>
        </section>
    </div>
</body>
</html>
